      <circle cx="858" cy="197" r="3"/><circle cx="929" cy="197" r="3"/><circle cx="997" cy="197" r="3"/><circle cx="1060" cy="197" r="3"/>
      <circle cx="839" cy="246" r="3"/><circle cx="893" cy="246" r="3"/><circle cx="958" cy="246" r="3"/><circle cx="1041" cy="246" r="3"/>
      <circle cx="856" cy="295" r="3"/><circle cx="920" cy="295" r="3"/><circle cx="984" cy="295" r="3"/><circle cx="1065" cy="295" r="3"/>
      <circle cx="840" cy="344" r="3"/><circle cx="905" cy="344" r="3"/><circle cx="970" cy="344" r="3"/><circle cx="1048" cy="344" r="3"/>
      <circle cx="861" cy="393" r="3"/><circle cx="932" cy="393" r="3"/><circle cx="1001" cy="393" r="3"/><circle cx="1070" cy="393" r="3"/>
    </g>
    <g fill="#e0455f" filter="url(#glow)">
      <circle cx="1036" cy="148" r="5"/>
      <circle cx="929" cy="197" r="5"/>
      <circle cx="958" cy="246" r="5"/>
      <circle cx="856" cy="295" r="5"/>
      <circle cx="970" cy="344" r="5"/>
      <circle cx="1070" cy="393" r="5"/>
    </g>
    <path d="M1036 148C1003 162 970 182 929 197S915 231 958 246 925 274 856 295 909 326 970 344 1020 373 1070 393" fill="none" stroke="url(#rail)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 8"/>
    <path d="M1070 393C1070 431 1028 444 988 460" fill="none" stroke="#e0455f" stroke-width="2"/>
    <circle cx="978" cy="464" r="5" fill="#e0455f" filter="url(#glow)"/>
    <rect x="862" y="487" width="226" height="52" rx="4" fill="#eef0f7"/>
    <text x="975" y="508" text-anchor="middle" class="mono" fill="#05070d" font-size="9.5" font-weight="600" letter-spacing="1.5">CROSS-LAYER FEATURES</text>
    <text x="975" y="528" text-anchor="middle" class="display" fill="#05070d" font-size="19" font-weight="700">SPIN</text>
  </g>

  <text x="72" y="566" class="mono" fill="#6f7893" font-size="10.5" font-weight="500" letter-spacing="1.1">LAYER-WISE PROBES · NEURON SELECTION · INTEGRATION</text>
  <text x="1128" y="566" text-anchor="end" class="mono" fill="#6f7893" font-size="10.5" font-weight="500" letter-spacing="1.1">SPINiverse / SPIN</text>
</svg>
