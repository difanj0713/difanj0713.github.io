<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MINER</title>
  <desc id="desc">MINER mines multimodal internal representations for efficient retrieval with 42.4 times less index storage than Jina late interaction on ViDoRe V2.</desc>
  <defs>
    <radialGradient id="mintGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(970 240) rotate(137) scale(425 475)">
      <stop stop-color="#65d6c1" stop-opacity=".19"/>
      <stop offset="1" stop-color="#65d6c1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(810 605) rotate(-64) scale(310 450)">
      <stop stop-color="#7d8dff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#7d8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="774" y1="320" x2="1110" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7d8dff"/>
      <stop offset=".56" stop-color="#65d6c1"/>
      <stop offset="1" stop-color="#f0aa5b"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#eef0f7" stroke-opacity=".03"/>
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Overpass:wght@400;500;600&amp;family=Platypi:wght@600;700;800&amp;display=swap');
      .display { font-family: 'Platypi', Georgia, serif; }
      .sans { font-family: 'Overpass', Arial, sans-serif; }
      .mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#05070d"/>
  <rect width="1200" height="630" fill="url(#mintGlow)"/>
  <rect width="1200" height="630" fill="url(#blueGlow)"/>
  <rect x="720" width="480" height="630" fill="url(#grid)"/>
  <rect x="28.5" y="28.5" width="1143" height="573" rx="8" fill="none" stroke="#eef0f7" stroke-opacity=".09"/>

  <g transform="translate(72 66)">
    <rect width="26" height="4" rx="2" fill="#65d6c1"/>
    <rect y="8" width="26" height="4" rx="2" fill="#7d8dff"/>
    <rect y="16" width="16" height="4" rx="2" fill="#7d8dff" opacity=".55"/>
    <text x="42" y="12" class="mono" fill="#a9b1c7" font-size="12" font-weight="600" letter-spacing="1.8">SPINiverse / 03</text>
    <text x="42" y="31" class="mono" fill="#6f7893" font-size="10" font-weight="500" letter-spacing="1.8">VISUAL DOCUMENT RETRIEVAL</text>
  </g>

  <text x="65" y="250" class="display" fill="#eef0f7" font-size="139" font-weight="800" letter-spacing="-9">MINER</text>
  <text x="72" y="326" class="display" fill="#eef0f7" font-size="43" font-weight="650" letter-spacing="-1.8">
    <tspan x="72">Internal representations</tspan>
    <tspan x="72" dy="53">for efficient retrieval</tspan>
  </text>

  <g transform="translate(72 496)">
    <text class="display" fill="#65d6c1" font-size="47" font-weight="700" letter-spacing="-1.8">42.4×</text>
    <line x1="137" y1="-16" x2="137" y2="31" stroke="#eef0f7" stroke-opacity=".16"/>
    <text x="161" y="-2" class="mono" fill="#a9b1c7" font-size="11" font-weight="600" letter-spacing="1.35">
      <tspan x="161">SMALLER INDEX THAN JINA</tspan>
      <tspan x="161" dy="20">LATE INTERACTION · VIDORE V2</tspan>
    </text>
  </g>

  <g aria-hidden="true">
    <text x="781" y="103" class="mono" fill="#6f7893" font-size="10" font-weight="600" letter-spacing="1.6">MINE · ALIGN · FUSE</text>

    <g transform="translate(780 137)">
      <rect width="105" height="134" rx="4" fill="#0a0e18" stroke="#eef0f7" stroke-opacity=".15"/>
      <text x="14" y="24" class="mono" fill="#65d6c1" font-size="8.5" font-weight="600" letter-spacing="1.2">QUERY</text>
      <rect x="14" y="43" width="69" height="4" rx="2" fill="#eef0f7" opacity=".75"/>
      <rect x="14" y="56" width="58" height="4" rx="2" fill="#eef0f7" opacity=".36"/>
      <rect x="14" y="69" width="75" height="4" rx="2" fill="#eef0f7" opacity=".25"/>
      <rect x="14" y="94" width="77" height="25" rx="2" fill="#65d6c1" opacity=".13"/>
      <path d="m26 108 8-8 9 9 10-12 19 18" fill="none" stroke="#65d6c1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(920 126) rotate(3 51 70)">
      <rect width="103" height="142" rx="4" fill="#0a0e18" stroke="#eef0f7" stroke-opacity=".15"/>
      <rect x="13" y="13" width="77" height="47" rx="2" fill="#7d8dff" opacity=".11"/>
      <circle cx="36" cy="36" r="10" fill="#7d8dff" opacity=".45"/>
      <path d="m18 54 15-14 12 8 17-19 22 25" fill="none" stroke="#7d8dff" stroke-opacity=".72" stroke-width="2"/>
      <rect x="13" y="75" width="72" height="4" rx="2" fill="#eef0f7" opacity=".54"/>
      <rect x="13" y="87" width="62" height="4" rx="2" fill="#eef0f7" opacity=".27"/>
      <rect x="13" y="99" width="76" height="4" rx="2" fill="#eef0f7" opacity=".27"/>
      <rect x="13" y="111" width="49" height="4" rx="2" fill="#eef0f7" opacity=".2"/>
      <rect x="13" y="126" width="30" height="3" rx="1.5" fill="#f0aa5b" opacity=".65"/>
    </g>

    <path d="M833 289V316M972 286V316" fill="none" stroke="#eef0f7" stroke-opacity=".2"/>
    <path d="M833 316C867 316 866 338 904 338S944 316 972 316" fill="none" stroke="url(#flow)" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 7"/>
    <circle cx="904" cy="338" r="5" fill="#65d6c1" filter="url(#glow)"/>

    <g transform="translate(788 369)">
      <rect x="0" y="0" width="272" height="15" rx="2" fill="#111725" stroke="#eef0f7" stroke-opacity=".08"/>
      <rect x="12" y="28" width="248" height="15" rx="2" fill="#111725" stroke="#eef0f7" stroke-opacity=".08"/>
      <rect x="24" y="56" width="224" height="15" rx="2" fill="#111725" stroke="#eef0f7" stroke-opacity=".08"/>
      <rect x="36" y="84" width="200" height="15" rx="2" fill="#111725" stroke="#eef0f7" stroke-opacity=".08"/>
      <g fill="#65d6c1">
        <circle cx="47" cy="7.5" r="3.5"/><circle cx="177" cy="7.5" r="3.5"/>
        <circle cx="94" cy="35.5" r="3.5"/><circle cx="217" cy="35.5" r="3.5"/>
        <circle cx="72" cy="63.5" r="3.5"/><circle cx="166" cy="63.5" r="3.5"/>
        <circle cx="128" cy="91.5" r="3.5"/><circle cx="206" cy="91.5" r="3.5"/>
      </g>
    </g>

    <path d="M1063 419H1093" stroke="#65d6c1" stroke-width="2"/>
    <path d="m1086 413 7 6-7 6" fill="none" stroke="#65d6c1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1098" y="376" width="43" height="102" rx="4" fill="#eef0f7"/>
    <g fill="#05070d">
      <rect x="1109" y="390" width="21" height="4" rx="2" opacity=".32"/>
      <rect x="1109" y="402" width="14" height="4" rx="2" opacity=".48"/>
      <rect x="1109" y="414" width="19" height="4" rx="2" opacity=".66"/>
      <rect x="1109" y="426" width="10" height="4" rx="2" opacity=".38"/>
      <rect x="1109" y="438" width="21" height="4" rx="2" opacity=".78"/>
      <rect x="1109" y="450" width="16" height="4" rx="2" opacity=".52"/>
    </g>
    <text x="1119.5" y="496" text-anchor="middle" class="mono" fill="#65d6c1" font-size="9" font-weight="600" letter-spacing="1">1 × D</text>
    <text x="965" y="525" text-anchor="middle" class="mono" fill="#6f7893" font-size="9.5" font-weight="600" letter-spacing="1.3">ONE COMPACT EMBEDDING</text>
  </g>

  <text x="72" y="566" class="mono" fill="#6f7893" font-size="10.5" font-weight="500" letter-spacing="1.1">NORMALIZED CKA · ALIGNMENT · DIMENSION-PRESERVING FUSION</text>
  <text x="1128" y="566" text-anchor="end" class="mono" fill="#6f7893" font-size="10.5" font-weight="500" letter-spacing="1.1">SPINiverse / MINER</text>
</svg>
