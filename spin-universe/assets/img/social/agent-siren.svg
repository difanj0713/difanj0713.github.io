<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agent-SIREN</title>
  <desc id="desc">The guard saw the risk. Its verdict did not. Agent-SIREN uses 2,561 trainable parameters on Qwen3-4B.</desc>
  <defs>
    <radialGradient id="redGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 260) rotate(135) scale(420 470)">
      <stop stop-color="#ea526b" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ea526b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1090 560) rotate(-133) scale(300 420)">
      <stop stop-color="#8290ff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#8290ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="riskLine" x1="810" y1="190" x2="1110" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8290ff"/>
      <stop offset="1" stop-color="#ea526b"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#eef0f7" stroke-opacity=".032"/>
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Overpass:wght@400;500;600&amp;family=Platypi:wght@600;700;800&amp;display=swap');
      .display { font-family: 'Platypi', Georgia, serif; }
      .sans { font-family: 'Overpass', Arial, sans-serif; }
      .mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#070911"/>
  <rect width="1200" height="630" fill="url(#redGlow)"/>
  <rect width="1200" height="630" fill="url(#blueGlow)"/>
  <rect x="720" width="480" height="630" fill="url(#grid)"/>
  <circle cx="1176" cy="212" r="185" fill="none" stroke="#8290ff" stroke-opacity=".07"/>
  <circle cx="1176" cy="212" r="255" fill="none" stroke="#8290ff" stroke-opacity=".04"/>
  <rect x="28.5" y="28.5" width="1143" height="573" rx="8" fill="none" stroke="#eef0f7" stroke-opacity=".09"/>

  <g transform="translate(72 66)">
    <rect width="26" height="4" rx="2" fill="#ea526b"/>
    <rect y="8" width="26" height="4" rx="2" fill="#8290ff"/>
    <rect y="16" width="16" height="4" rx="2" fill="#8290ff" opacity=".55"/>
    <text x="42" y="12" class="mono" fill="#b4bbcc" font-size="12" font-weight="600" letter-spacing="1.8">SPINiverse / 04</text>
    <text x="42" y="31" class="mono" fill="#747d94" font-size="10" font-weight="500" letter-spacing="1.8">AGENT TRAJECTORY SAFETY</text>
  </g>

  <text x="65" y="232" class="display" fill="#f3f4f9" font-size="102" font-weight="800" letter-spacing="-7.5">Agent-SIREN</text>
  <text x="72" y="313" class="display" fill="#f3f4f9" font-size="43" font-weight="650" letter-spacing="-1.9">
    <tspan x="72">The guard saw the risk.</tspan>
    <tspan x="72" dy="53">Its verdict did not.</tspan>
  </text>

  <g transform="translate(72 496)">
    <text class="display" fill="#ea526b" font-size="46" font-weight="700" letter-spacing="-1.7">2,561</text>
    <line x1="128" y1="-16" x2="128" y2="31" stroke="#eef0f7" stroke-opacity=".16"/>
    <text x="152" y="-2" class="mono" fill="#b4bbcc" font-size="11" font-weight="600" letter-spacing="1.35">
      <tspan x="152">TRAINABLE PARAMETERS</tspan>
      <tspan x="152" dy="20">ON QWEN3-4B</tspan>
    </text>
  </g>

  <g aria-hidden="true">
    <text x="796" y="103" class="mono" fill="#747d94" font-size="10" font-weight="600" letter-spacing="1.6">ONE FROZEN GUARD · TWO INTERFACES</text>

    <g transform="translate(790 136)">
      <rect width="218" height="296" rx="5" fill="#0d111c" stroke="#eef0f7" stroke-opacity=".14"/>
      <text x="18" y="29" class="mono" fill="#747d94" font-size="9" font-weight="600" letter-spacing="1.25">AGENT TRAJECTORY</text>
      <g>
        <circle cx="25" cy="63" r="6" fill="#8290ff"/>
        <path d="M25 70V104" stroke="#eef0f7" stroke-opacity=".18"/>
        <circle cx="25" cy="111" r="6" fill="#5ac9bd"/>
        <path d="M25 118V152" stroke="#eef0f7" stroke-opacity=".18"/>
        <circle cx="25" cy="159" r="6" fill="#ea526b"/>
      </g>
      <text x="45" y="67" class="mono" fill="#b4bbcc" font-size="9.5" letter-spacing="1">REQUEST</text>
      <text x="45" y="115" class="mono" fill="#b4bbcc" font-size="9.5" letter-spacing="1">TOOL SCHEMA</text>
      <text x="45" y="163" class="mono" fill="#b4bbcc" font-size="9.5" letter-spacing="1">ACTION</text>
      <line x1="18" y1="192" x2="200" y2="192" stroke="#eef0f7" stroke-opacity=".1"/>
      <text x="18" y="218" class="mono" fill="#747d94" font-size="9" font-weight="600" letter-spacing="1.2">FROZEN MODEL</text>
      <g fill="#121725" stroke="#eef0f7" stroke-opacity=".08">
        <rect x="18" y="235" width="182" height="10" rx="2"/>
        <rect x="18" y="253" width="182" height="10" rx="2"/>
        <rect x="18" y="271" width="182" height="10" rx="2"/>
      </g>
      <rect x="18" y="253" width="182" height="10" rx="2" fill="#ea526b" opacity=".26"/>
      <circle cx="146" cy="258" r="4" fill="#ea526b" filter="url(#glow)"/>
    </g>

    <path d="M1008 292H1042" stroke="#eef0f7" stroke-opacity=".22"/>
    <path d="M1008 394C1031 394 1025 472 1054 472" fill="none" stroke="url(#riskLine)" stroke-width="2"/>

    <g transform="translate(1044 238)">
      <rect width="102" height="108" rx="4" fill="#0d111c" stroke="#eef0f7" stroke-opacity=".14"/>
      <text x="14" y="24" class="mono" fill="#747d94" font-size="8" font-weight="600" letter-spacing="1">VERDICT</text>
      <text x="14" y="66" class="display" fill="#b4bbcc" font-size="31" font-weight="700">SAFE</text>
      <line x1="14" y1="82" x2="88" y2="82" stroke="#eef0f7" stroke-opacity=".11"/>
      <text x="14" y="98" class="mono" fill="#747d94" font-size="7.5" letter-spacing=".8">GENERATED</text>
    </g>

    <g transform="translate(1044 418)">
      <rect width="102" height="108" rx="4" fill="#f3f4f9"/>
      <text x="14" y="24" class="mono" fill="#687082" font-size="8" font-weight="600" letter-spacing="1">READOUT</text>
      <text x="14" y="66" class="display" fill="#ea526b" font-size="31" font-weight="700">RISK</text>
      <line x1="14" y1="82" x2="88" y2="82" stroke="#070911" stroke-opacity=".14"/>
      <text x="14" y="98" class="mono" fill="#687082" font-size="7.5" letter-spacing=".8">INTERNAL</text>
    </g>
    <circle cx="1044" cy="472" r="5" fill="#ea526b" filter="url(#glow)"/>
  </g>

  <text x="72" y="566" class="mono" fill="#747d94" font-size="10.5" font-weight="500" letter-spacing="1.1">Read risk before the verdict loses it.</text>
  <text x="1128" y="566" text-anchor="end" class="mono" fill="#747d94" font-size="10.5" font-weight="500" letter-spacing="1.1">SPINiverse / AGENT-SIREN</text>
</svg>
