<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SIREN</title>
  <desc id="desc">The general model beat the guard built from it, with approximately five times fewer inference FLOPs.</desc>
  <defs>
    <radialGradient id="redGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(975 240) rotate(137) scale(425 475)">
      <stop stop-color="#e0455f" stop-opacity=".24"/>
      <stop offset="1" stop-color="#e0455f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 605) rotate(-64) scale(300 430)">
      <stop stop-color="#7d8dff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#7d8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="score" x1="828" y1="0" x2="1096" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7d8dff"/>
      <stop offset="1" stop-color="#e0455f"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#eef0f7" stroke-opacity=".03"/>
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Overpass:wght@400;500;600&amp;family=Platypi:wght@600;700;800&amp;display=swap');
      .display { font-family: 'Platypi', Georgia, serif; }
      .sans { font-family: 'Overpass', Arial, sans-serif; }
      .mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#05070d"/>
  <rect width="1200" height="630" fill="url(#redGlow)"/>
  <rect width="1200" height="630" fill="url(#blueGlow)"/>
  <rect x="720" width="480" height="630" fill="url(#grid)"/>
  <rect x="28.5" y="28.5" width="1143" height="573" rx="8" fill="none" stroke="#eef0f7" stroke-opacity=".09"/>

  <g transform="translate(72 66)">
    <rect width="26" height="4" rx="2" fill="#e0455f"/>
    <rect y="8" width="26" height="4" rx="2" fill="#7d8dff"/>
    <rect y="16" width="16" height="4" rx="2" fill="#7d8dff" opacity=".55"/>
    <text x="42" y="12" class="mono" fill="#a9b1c7" font-size="12" font-weight="600" letter-spacing="1.8">SPINiverse / 02</text>
    <text x="42" y="31" class="mono" fill="#6f7893" font-size="10" font-weight="500" letter-spacing="1.8">CONTENT SAFETY · ACL 2026 MAIN</text>
  </g>

  <text x="65" y="250" class="display" fill="#eef0f7" font-size="143" font-weight="800" letter-spacing="-9">SIREN</text>
  <text x="72" y="326" class="display" fill="#eef0f7" font-size="42" font-weight="650" letter-spacing="-1.8">
    <tspan x="72">The general model beat</tspan>
    <tspan x="72" dy="53">the guard built from it.</tspan>
  </text>

  <g transform="translate(72 496)">
    <text class="display" fill="#e0455f" font-size="49" font-weight="700" letter-spacing="-1.8">≈5×</text>
    <line x1="111" y1="-16" x2="111" y2="31" stroke="#eef0f7" stroke-opacity=".16"/>
    <text x="135" y="-2" class="mono" fill="#a9b1c7" font-size="11" font-weight="600" letter-spacing="1.35">
      <tspan x="135">FEWER INFERENCE FLOPs</tspan>
      <tspan x="135" dy="20">NO TOKEN-BY-TOKEN VERDICT</tspan>
    </text>
  </g>

  <g aria-hidden="true">
    <text x="797" y="103" class="mono" fill="#6f7893" font-size="10" font-weight="600" letter-spacing="1.6">SAFETY SIGNAL · FROZEN GENERAL MODEL</text>
    <rect x="796" y="128" width="310" height="294" rx="5" fill="#0a0e18" stroke="#eef0f7" stroke-opacity=".14"/>
    <g>
      <rect x="822" y="155" width="258" height="18" rx="2" fill="#111625" stroke="#eef0f7" stroke-opacity=".09"/>
      <rect x="822" y="190" width="258" height="18" rx="2" fill="#111625" stroke="#eef0f7" stroke-opacity=".09"/>
      <rect x="822" y="225" width="258" height="18" rx="2" fill="#111625" stroke="#eef0f7" stroke-opacity=".09"/>
      <rect x="822" y="260" width="258" height="18" rx="2" fill="#111625" stroke="#eef0f7" stroke-opacity=".09"/>
      <rect x="822" y="295" width="258" height="18" rx="2" fill="#111625" stroke="#eef0f7" stroke-opacity=".09"/>
      <rect x="822" y="330" width="258" height="18" rx="2" fill="#111625" stroke="#eef0f7" stroke-opacity=".09"/>
      <rect x="822" y="365" width="258" height="18" rx="2" fill="#111625" stroke="#eef0f7" stroke-opacity=".09"/>
    </g>
    <g fill="#7d8dff" opacity=".37">
      <circle cx="850" cy="164" r="3"/><circle cx="910" cy="164" r="3"/><circle cx="1008" cy="164" r="3"/><circle cx="1052" cy="164" r="3"/>
      <circle cx="871" cy="199" r="3"/><circle cx="944" cy="199" r="3"/><circle cx="1027" cy="199" r="3"/>
      <circle cx="844" cy="234" r="3"/><circle cx="931" cy="234" r="3"/><circle cx="998" cy="234" r="3"/><circle cx="1061" cy="234" r="3"/>
      <circle cx="869" cy="269" r="3"/><circle cx="921" cy="269" r="3"/><circle cx="1037" cy="269" r="3"/>
      <circle cx="847" cy="304" r="3"/><circle cx="965" cy="304" r="3"/><circle cx="1049" cy="304" r="3"/>
      <circle cx="881" cy="339" r="3"/><circle cx="942" cy="339" r="3"/><circle cx="1020" cy="339" r="3"/>
      <circle cx="855" cy="374" r="3"/><circle cx="981" cy="374" r="3"/><circle cx="1058" cy="374" r="3"/>
    </g>
    <g fill="#e0455f" filter="url(#glow)">
      <circle cx="1052" cy="164" r="5"/><circle cx="944" cy="199" r="5"/><circle cx="998" cy="234" r="5"/>
      <circle cx="921" cy="269" r="5"/><circle cx="965" cy="304" r="5"/><circle cx="1020" cy="339" r="5"/><circle cx="981" cy="374" r="5"/>
    </g>
    <path d="M1052 164C1024 177 988 187 944 199S955 222 998 234 960 257 921 269 930 291 965 304 1000 326 1020 339 1008 359 981 374" fill="none" stroke="url(#score)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 8"/>
    <path d="M981 383V447" stroke="#e0455f" stroke-width="2"/>
    <circle cx="981" cy="452" r="5" fill="#e0455f" filter="url(#glow)"/>
    <rect x="815" y="476" width="332" height="63" rx="4" fill="#eef0f7"/>
    <text x="839" y="500" class="mono" fill="#50586a" font-size="9.5" font-weight="600" letter-spacing="1.25">DIRECT READOUT</text>
    <text x="839" y="524" class="display" fill="#05070d" font-size="23" font-weight="700">Harmfulness score</text>
    <circle cx="1113" cy="507" r="14" fill="#e0455f"/>
    <path d="m1107 507 4 4 8-9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="72" y="566" class="mono" fill="#6f7893" font-size="10.5" font-weight="500" letter-spacing="1.1">Read the signal. Skip the verdict.</text>
  <text x="1128" y="566" text-anchor="end" class="mono" fill="#6f7893" font-size="10.5" font-weight="500" letter-spacing="1.1">SPINiverse / SIREN</text>
</svg>
